components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by the authenticate operation. JWTs last 24 hours according to the method source.
  responses:
    AuthenticationFailed:
      description: Authentication request could not be accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              summary: Wrong key, unknown email or incorrect password.
              value:
                errors:
                - Failed to authenticate.
            identityLinked:
              summary: Username/password cannot be used after the account is connected to a TradeTracker ID.
              value:
                errors:
                - This account signs in with a TradeTracker ID. Authenticate with tradetracker_id and api_key from the Web Services page (REST) instead of a username and password.
            mfaRequired:
              summary: Two-step verification must be configured first.
              value:
                errors:
                - Two-step verification is required for your TradeTracker ID. Set it up on the TradeTracker website, then sign in again.
    Unauthorized:
      description: JWT invalid, expired, or no longer permitted. Authenticate again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            expiredOrInvalidJwt:
              summary: Expired JWT, regenerated API key or ended session.
              value:
                errors:
                - 401 Unauthorized
            identityLinked:
              summary: The account was connected to a TradeTracker ID after the JWT was issued.
              value:
                errors:
                - This account is now connected to a TradeTracker ID. Please sign in again with your TradeTracker ID email.
                error_code: login_identity_linked
            mfaSetupRequired:
              summary: Two-step verification is now required.
              value:
                errors:
                - Two-step verification is required for your TradeTracker ID. Set it up on the TradeTracker website, then sign in again.
                error_code: login_identity_mfa_setup_required
