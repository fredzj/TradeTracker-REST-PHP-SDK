openapi: 3.1.1
info:
  title: TradeTracker Web Services REST API
  version: 1.0.0
  description: OpenAPI 3.1 specification generated from the supplied method definitions, type definitions and HTTP example scripts. All operations use JSON request bodies and return a JSON envelope containing `data` and `success`.
servers:
- url: https://ws.tradetracker.com
  description: TradeTracker Web Services REST API server from the supplied scripts.
tags:
- name: Authentication
  description: JWT authentication.
- name: Affiliate sites
  description: Affiliate-site data and taxonomy.
- name: Campaigns
  description: Campaign data, categories, commissions and news.
- name: Transactions
  description: Click, conversion, attribution and touchpoint data.
- name: Product feeds
  description: Product-feed metadata, categories and products.
- name: Materials
  description: Promotional materials and banner dimensions.
- name: Payments
  description: Payment notices.
- name: Reports
  description: Affiliate-site, campaign and reference performance reports.
security:
- bearerAuth: []
paths:
  /rest/affiliate/authenticate:
    post:
      tags:
      - Authentication
      operationId: authenticate
      summary: Signs in and returns a JWT. Send it with every other call in the header Authorization, as Bearer followed by the JWT. A JWT lasts 24 hours; authenticate again when a call answers 401.
      description: 'Source method signature: `void authenticate ( string tradetracker_id, string api_key, string username, string password, boolean sandbox, Locale locale, boolean demo )`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
            examples:
              sourceExample:
                summary: Example from supplied script.
                value:
                  tradetracker_id: jane@example.com
                  api_key: 3f9a6c2e8b1d4f70a5e2c9b8d7f6e5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
              examples:
                sourceExample:
                  summary: Example from supplied script.
                  value:
                    data:
                      jwt: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJkYXRhIjp7InVzZXJJRCI6MTIzNDV9fQ.c2lnbmF0dXJl
                    success: true
        '400':
          $ref: '#/components/responses/AuthenticationFailed'
      x-source-method-signature: void authenticate ( string tradetracker_id, string api_key, string username, string password, boolean sandbox, Locale locale, boolean demo )
      security: []
